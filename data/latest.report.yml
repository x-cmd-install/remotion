{"id":457095688,"author":{"login":"JonnyBurger","id":1629785,"node_id":"MDQ6VXNlcjE2Mjk3ODU=","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOEFx3wc4bProI","tag_name":"v4.0.547","target_commitish":"main","name":"v4.0.547","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-24T16:49:11Z","updated_at":"2026-11-24T17:20:40Z","published_at":"2026-11-24T17:20:40Z","assets":[],"body":"## What's Changed\n\n- [`@remotion/cli`: Add `remotion elements add-library` for adding Element Libraries to the config](https://remotion.dev/docs/cli/elements/add-library) by @samohovets in https://github.com/remotion-dev/remotion/pull/13584\n- `remotion`: Fix `useVideoConfig()` of a sequence with explicit `durationInFrames` being clamped by composition duration by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13605\n- `remotion`: Keep emitted artifacts inside the output directory by @DeryFerd in https://github.com/remotion-dev/remotion/pull/13532\n- `@remotion/effects`: Keep WebGPU effects at 16-bit precision between passes by @dukeeagle in https://github.com/remotion-dev/remotion/pull/13509\n- `@remotion/media-utils`: Zero-pad `visualizeAudio()` FFT windows at the start of the audio by @Dani-Google in https://github.com/remotion-dev/remotion/pull/13592\n- `@remotion/studio`: Add settings search and inline descriptions by @Tatsuya0330 in https://github.com/remotion-dev/remotion/pull/13573\n- `@remotion/studio`: Apply the selected double-click action immediately by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13580\n- `@remotion/web-renderer`: Release capture canvases during export by @alec-watts in https://github.com/remotion-dev/remotion/pull/13574\n\n## Skills\n\n- Add `/remotion-elements` skill for installing Elements by @samohovets in https://github.com/remotion-dev/remotion/pull/13583\n- Install Basic Captions with `remotion elements use` by @samohovets in https://github.com/remotion-dev/remotion/pull/13581\n- Remove `/scaffold-element` skill by @samohovets in https://github.com/remotion-dev/remotion/pull/13601\n- Keep \"Connect to Remotion Studio\" step badges round by @samohovets in https://github.com/remotion-dev/remotion/pull/13578\n\n## Templates\n\n- Set TypeScript `lib` to ES2022 by @samohovets in https://github.com/remotion-dev/remotion/pull/13600\n\n## Docs\n\n- Add guides for [styling](https://remotion.dev/docs/captions/styling) and [editing](https://remotion.dev/docs/captions/editing) captions by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13586\n- [Move agent documentation to `/docs/agents`](https://remotion.dev/docs/agents) by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13602\n- Simplify the captions overview by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13599\n- Fix off-by-one in remapSpeed() of the accelerated video snippet by @yunustopalogullari-sudo in https://github.com/remotion-dev/remotion/pull/13593\n\n## Internal and Experimental\n\n- Share setup across related test cases by @JonnyBurger in https://github.com/remotion-dev/remotion/pull/13570\n\n## New Contributors\n\n- @yunustopalogullari-sudo made their first contribution in https://github.com/remotion-dev/remotion/pull/13593\n\n**Full Changelog**: https://github.com/remotion-dev/remotion/compare/v4.0.546...v4.0.547\n","mentions_count":8}
